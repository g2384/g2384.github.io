<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#111613">
	<title>QR Reader</title>
	<style>
		:root {
			color-scheme: dark;
			--background: #111613;
			--surface: #1b231e;
			--surface-raised: #253029;
			--text: #f4f6f0;
			--muted: #aeb9b1;
			--accent: #b9f46f;
			--accent-text: #132008;
			--danger: #ffb4a8;
			--border: #3c4940;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			min-height: 100%;
			margin: 0;
		}

		body {
			background:
				linear-gradient(rgba(185, 244, 111, 0.035) 1px, transparent 1px),
				linear-gradient(90deg, rgba(185, 244, 111, 0.035) 1px, transparent 1px),
				var(--background);
			background-size: 24px 24px;
			color: var(--text);
			font-family: "Trebuchet MS", Verdana, sans-serif;
		}

		main {
			display: grid;
			grid-template-rows: minmax(320px, 58dvh) auto;
			min-height: 100dvh;
		}

		.camera-panel {
			position: relative;
			min-height: 320px;
			overflow: hidden;
			background: #050705;
		}

		video {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.camera-panel::after {
			position: absolute;
			top: 50%;
			left: 50%;
			width: min(68vw, 310px);
			aspect-ratio: 1;
			border: 3px solid var(--accent);
			border-radius: 8px;
			box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.36);
			content: "";
			transform: translate(-50%, -50%);
			pointer-events: none;
		}

		.camera-title {
			position: absolute;
			z-index: 1;
			top: max(16px, env(safe-area-inset-top));
			left: 18px;
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: 1.35rem;
			font-weight: 700;
			letter-spacing: 0;
			text-shadow: 0 2px 8px #000;
		}

		.status {
			position: absolute;
			z-index: 1;
			right: 16px;
			bottom: 16px;
			left: 16px;
			margin: 0;
			padding: 10px 14px;
			border: 1px solid rgba(255, 255, 255, 0.22);
			border-radius: 6px;
			background: rgba(17, 22, 19, 0.88);
			color: var(--muted);
			font-size: 0.95rem;
			text-align: center;
			backdrop-filter: blur(8px);
		}

		.status[data-state="success"] {
			border-color: var(--accent);
			color: var(--accent);
		}

		.status[data-state="error"] {
			border-color: var(--danger);
			color: var(--danger);
		}

		.results-panel {
			display: grid;
			gap: 12px;
			align-content: start;
			padding: 18px 16px max(20px, env(safe-area-inset-bottom));
			border-top: 1px solid var(--border);
			background: rgba(27, 35, 30, 0.96);
		}

		label {
			color: var(--muted);
			font-size: 0.82rem;
			font-weight: 700;
			text-transform: uppercase;
		}

		textarea {
			width: 100%;
			min-height: 132px;
			resize: vertical;
			padding: 12px;
			border: 1px solid var(--border);
			border-radius: 6px;
			outline: none;
			background: #101511;
			color: var(--text);
			font: 1rem/1.45 Consolas, monospace;
		}

		textarea:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 2px rgba(185, 244, 111, 0.16);
		}

		.actions {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 10px;
		}

		button {
			min-height: 50px;
			padding: 10px 14px;
			border: 1px solid var(--accent);
			border-radius: 6px;
			background: var(--accent);
			color: var(--accent-text);
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}

		button:first-child {
			background: transparent;
			color: var(--accent);
		}

		button:disabled {
			border-color: var(--border);
			background: var(--surface-raised);
			color: #7e8981;
			cursor: not-allowed;
		}

		canvas {
			display: none;
		}

		@media (min-width: 800px) {
			body {
				display: grid;
				place-items: center;
				padding: 28px;
			}

			main {
				grid-template-columns: minmax(420px, 3fr) minmax(320px, 2fr);
				grid-template-rows: min(760px, calc(100dvh - 56px));
				width: min(1120px, 100%);
				min-height: 0;
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: 8px;
				box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
			}

			.results-panel {
				align-content: center;
				padding: 32px;
				border-top: 0;
				border-left: 1px solid var(--border);
			}
		}
	</style>
</head>
<body>
	<main>
		<section class="camera-panel" aria-labelledby="camera-title">
			<h1 class="camera-title" id="camera-title">QR Reader</h1>
			<video id="camera" playsinline muted aria-label="Rear camera live view"></video>
			<p class="status" id="status" role="status" aria-live="polite">Starting rear camera...</p>
		</section>

		<section class="results-panel" aria-labelledby="values-label">
			<label id="values-label" for="values">Read values</label>
			<textarea id="values" placeholder="Confirmed QR values appear here" readonly></textarea>
			<div class="actions">
				<button id="append" type="button" disabled>Append value</button>
				<button id="replace" type="button" disabled>Write new</button>
				<button id="copy" type="button" disabled>Copy</button>
			</div>
		</section>
	</main>

	<canvas id="capture"></canvas>
	<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
	<script>
		"use strict";

		const video = document.getElementById("camera");
		const canvas = document.getElementById("capture");
		const context = canvas.getContext("2d", { willReadFrequently: true });
		const status = document.getElementById("status");
		const values = document.getElementById("values");
		const appendButton = document.getElementById("append");
		const replaceButton = document.getElementById("replace");
		const copyButton = document.getElementById("copy");

		let recognisedValue = "";
		let lastRecognisedValue = "";
		let animationFrameId;
		let lastScanTime = 0;
		let consecutiveMisses = 0;
		const missesBeforeFailure = 5;

		function setRecognisedValue(value) {
			if (value.length === 0) {
				consecutiveMisses += 1;
				if (consecutiveMisses < missesBeforeFailure) {
					return;
				}

				recognisedValue = "";
				lastRecognisedValue = "";
				appendButton.disabled = true;
				replaceButton.disabled = true;
				status.dataset.state = "error";
				status.textContent = "QR code is not recognised";
				return;
			}

			consecutiveMisses = 0;
			if (value === lastRecognisedValue) {
				return;
			}

			recognisedValue = value;
			lastRecognisedValue = value;
			appendButton.disabled = false;
			replaceButton.disabled = false;
			status.dataset.state = "success";
			status.textContent = `Recognised: ${value}`;
		}

		function consumeRecognisedValue() {
			recognisedValue = "";
			appendButton.disabled = true;
			replaceButton.disabled = true;
		}

		function scanFrame(timestamp) {
			if (video.readyState === video.HAVE_ENOUGH_DATA && timestamp - lastScanTime >= 100) {
				lastScanTime = timestamp;
				const scale = Math.min(1, 720 / video.videoWidth);
				canvas.width = Math.round(video.videoWidth * scale);
				canvas.height = Math.round(video.videoHeight * scale);
				context.drawImage(video, 0, 0, canvas.width, canvas.height);

				const image = context.getImageData(0, 0, canvas.width, canvas.height);
				const result = jsQR(image.data, image.width, image.height, {
					inversionAttempts: "dontInvert"
				});

				setRecognisedValue(result?.data?.trim() ?? "");
			}

			animationFrameId = requestAnimationFrame(scanFrame);
		}

		async function startCamera() {
			if (!navigator.mediaDevices?.getUserMedia) {
				status.dataset.state = "error";
				status.textContent = "Camera access is not supported by this browser";
				return;
			}

			try {
				const stream = await navigator.mediaDevices.getUserMedia({
					audio: false,
					video: {
						facingMode: { ideal: "environment" },
						width: { ideal: 1920 },
						height: { ideal: 1080 }
					}
				});

				video.srcObject = stream;
				await video.play();
				setRecognisedValue("");
				scanFrame();
			} catch (error) {
				status.dataset.state = "error";
				status.textContent = error.name === "NotAllowedError"
					? "Camera permission was denied"
					: "Unable to start the rear camera";
			}
		}

		appendButton.addEventListener("click", () => {
			const separator = values.value.length > 0 && !values.value.endsWith("\n") ? "\n" : "";
			values.value += `${separator}${recognisedValue}`;
			copyButton.disabled = false;
			consumeRecognisedValue();
		});

		replaceButton.addEventListener("click", () => {
			values.value = recognisedValue;
			copyButton.disabled = false;
			consumeRecognisedValue();
		});

		copyButton.addEventListener("click", async () => {
			try {
				await navigator.clipboard.writeText(values.value);
				status.dataset.state = "success";
				status.textContent = "Copied values";
			} catch {
				status.dataset.state = "error";
				status.textContent = "Unable to copy values";
			}
		});

		window.addEventListener("pagehide", () => {
			cancelAnimationFrame(animationFrameId);
			video.srcObject?.getTracks().forEach(track => track.stop());
		});

		startCamera();
	</script>
</body>
</html>
